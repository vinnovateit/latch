[versions]
accompanistPager = "0.36.0"
accompanistPermissions = "0.37.3"
agp = "8.13.0"
androidxMaterial3 = "1.5.0-alpha09"
appcompatVersion = "1.7.1"
appUpdate = "2.1.0"
appUpdateKtx = "2.1.0"
coreSplashscreen = "1.2.0"
glanceAppwidget = "1.1.1"
glanceMaterial3 = "1.1.1"
googleGson = "2.13.1"
kotlin = "2.1.0"
coreKtx = "1.17.0"
junit = "4.13.2"
junitExt = "1.3.0"
espressoCore = "3.7.0"
kotlinxCollectionsImmutable = "0.4.0"
kotlinxSerializationJson = "1.9.0"
lifecycleRuntimeKtx = "2.9.3"
activityCompose = "1.10.1"
composeBom = "2025.08.01"
materialKolor = "3.0.1"
preferenceKtx = "1.2.1"
protoliteWellKnownTypes = "18.0.1"
securityCrypto = "1.1.0"
workRuntimeKtx = "2.10.3"
datastorePreferences = "1.1.7"
lifecycleCompose = "2.9.3"
navigationCompose = "2.9.3"
firebaseCrashlyticsBuildtools = "3.0.6"
foundationVersion = "1.9.0"
animation = "1.9.0"
hilt-navigation-compose = "1.2.0"
# Matches roomKmp below -- :app now transitively depends on :core's Room
# artifact (2.8.4) via api(...), so this must match or Gradle's classpath
# conflict resolution silently upgrades :app's runtime past what its own
# pinned room-compiler (ksp) targets.
room = "2.8.4"
foundation = "1.9.3"
animationCore = "1.9.3"

# --- :desktop (Compose Multiplatform / JVM) ---
# Kept separate from the Android versions above: the desktop module resolves the
# multiplatform artifact variants, which are versioned independently.
composeMultiplatform = "1.12.0"
# Explicitly NOT compose.material3 (which tracks composeMultiplatform). The
# desktop UI uses expressive APIs -- LoadingIndicator, ExperimentalMaterial3-
# ExpressiveApi -- that only exist in the alpha line.
composeMaterial3Mp = "1.10.0-alpha05"
ksp = "2.1.0-1.0.29"
lifecycleMp = "2.9.4"
kotlinxCoroutines = "1.10.2"
roomKmp = "2.8.4"
sqliteBundled = "2.7.0"
oshi = "6.12.0"
jna = "5.18.1"
slf4jSimple = "2.0.16"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
# Core
accompanist-pager = { module = "com.google.accompanist:accompanist-pager", version.ref = "accompanistPager" }
accompanist-pager-indicators = { module = "com.google.accompanist:accompanist-pager-indicators", version.ref = "accompanistPager" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }
androidx-appcompat-v161 = { module = "androidx.appcompat:appcompat", version.ref = "appcompatVersion" }
androidx-compose-foundation-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.3" }
androidx-compose-material-material-icons-extended2 = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-ui-test-junit42 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-ui-test-manifest4 = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-ui-tooling-preview2 = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-ui-tooling3 = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-ui2 = { module = "androidx.compose.ui:ui" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }


# Lifecycle
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glanceAppwidget" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glanceMaterial3" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleCompose" }

# Activity
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM and UI
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-material3-v150alpha01 = { module = "androidx.compose.material3:material3", version.ref = "androidxMaterial3" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preferenceKtx" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Data
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

# Firebase
animation = { module = "androidx.compose.animation:animation" }
app-update = { module = "com.google.android.play:app-update", version.ref = "appUpdate" }
app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "appUpdateKtx" }
firebase-crashlytics-buildtools = { group = "com.google.firebase", name = "firebase-crashlytics-buildtools", version.ref = "firebaseCrashlyticsBuildtools" }

# WorkManager
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }

# Testing
gson-v2110 = { module = "com.google.code.gson:gson", version.ref = "googleGson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
protolite-well-known-types = { group = "com.google.firebase", name = "protolite-well-known-types", version.ref = "protoliteWellKnownTypes" }

# AppCompat
foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundationVersion" }
androidx-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "animation" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core", version.ref = "animationCore" }

# --- :desktop (Compose Multiplatform / JVM) ---
# These resolve the -jvm / -desktop variants of each module. The androidx
# lifecycle and room artifacts are the same coordinates the Android app uses;
# Gradle picks the JVM variant from the multiplatform metadata.
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3Mp" }
lifecycle-viewmodel-mp = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycleMp" }
lifecycle-viewmodel-compose-mp = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleMp" }
lifecycle-runtime-compose-mp = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleMp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
# Required: Compose Desktop dispatches on the AWT event thread.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
room-runtime-desktop = { module = "androidx.room:room-runtime", version.ref = "roomKmp" }
room-compiler-desktop = { module = "androidx.room:room-compiler", version.ref = "roomKmp" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqliteBundled" }
oshi-core = { module = "com.github.oshi:oshi-core", version.ref = "oshi" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4jSimple" }
