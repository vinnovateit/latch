[versions]
accompanistPermissions = "0.37.3"
agp = "9.4.0"
androidxMaterial3 = "1.5.0-alpha27"
appcompatVersion = "1.8.0"
appUpdate = "2.1.0"
appUpdateKtx = "2.1.0"
coreSplashscreen = "1.2.0"
glanceAppwidget = "1.2.0"
glanceMaterial3 = "1.2.0"
kotlin = "2.4.10"
coreKtx = "1.19.0"
junit = "4.13.2"
junitExt = "1.3.0"
espressoCore = "3.7.0"
kotlinxCollectionsImmutable = "0.5.2"
kotlinxSerializationJson = "1.11.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
materialKolor = "5.0.1"
preferenceKtx = "1.2.1"
securityCrypto = "1.1.0"
workRuntimeKtx = "2.11.2"
datastorePreferences = "1.2.1"
lifecycleCompose = "2.11.0"
navigationCompose = "2.10.0"
foundationVersion = "1.12.0"

# --- :desktop (Compose Multiplatform / JVM) ---
# Kept separate from the Android versions above: the desktop module resolves the
# multiplatform artifact variants, which are versioned independently.
composeMultiplatform = "1.12.0"
# Explicitly NOT compose.material3 (which tracks composeMultiplatform). The
# desktop UI uses expressive APIs -- LoadingIndicator, ExperimentalMaterial3-
# ExpressiveApi -- that only exist in the alpha line.
composeMaterial3Mp = "1.12.0-alpha03"
ksp = "2.3.11"
lifecycleMp = "2.11.0"
kotlinxCoroutines = "1.11.0"
roomKmp = "2.8.4"
sqliteBundled = "2.7.0"
oshi = "7.6.1"
jna = "5.19.1"
slf4jSimple = "2.0.18"
composeMaterialCore = "1.6.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
# Core
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }
androidx-appcompat-v161 = { module = "androidx.appcompat:appcompat", version.ref = "appcompatVersion" }
androidx-compose-material-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
androidx-compose-ui-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-ui-test-junit42 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-ui-test-manifest4 = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-ui-ui-tooling-preview2 = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-ui-tooling3 = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-ui2 = { module = "androidx.compose.ui:ui" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }


# Lifecycle
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glanceAppwidget" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glanceMaterial3" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleCompose" }

# Activity
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM and UI
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-material3-v150alpha01 = { module = "androidx.compose.material3:material3", version.ref = "androidxMaterial3" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preferenceKtx" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Data
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

# Firebase
animation = { module = "androidx.compose.animation:animation" }
app-update = { module = "com.google.android.play:app-update", version.ref = "appUpdate" }
app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "appUpdateKtx" }
# WorkManager
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }

# AppCompat
foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundationVersion" }
# --- :desktop (Compose Multiplatform / JVM) ---
# These resolve the -jvm / -desktop variants of each module. The androidx
# lifecycle and room artifacts are the same coordinates the Android app uses;
# Gradle picks the JVM variant from the multiplatform metadata.
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3Mp" }
lifecycle-viewmodel-mp = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycleMp" }
lifecycle-viewmodel-compose-mp = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleMp" }
lifecycle-runtime-compose-mp = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleMp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
# Required: Compose Desktop dispatches on the AWT event thread.
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
room-runtime-desktop = { module = "androidx.room:room-runtime", version.ref = "roomKmp" }
room-compiler-desktop = { module = "androidx.room:room-compiler", version.ref = "roomKmp" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqliteBundled" }
oshi-core = { module = "com.github.oshi:oshi-core", version.ref = "oshi" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4jSimple" }
androidx-compose-material-core = { group = "androidx.wear.compose", name = "compose-material-core", version.ref = "composeMaterialCore" }
