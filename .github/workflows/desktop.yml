# Desktop/CLI counterpart to android.yml.
#
# android.yml runs `assembleDebug testDebugUnitTest :app:lintDebug`, which only
# reaches :core's androidTarget. That leaves :desktop, :cli and :core's
# desktopTest source set uncompiled and unrun on every PR -- a green Android
# check has never said anything about them. This job closes that gap.
#
# Kept as a separate workflow rather than a job in android.yml so the check
# name stays distinct if it is ever made a required status check.
name: Desktop CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Nothing here writes to the repository: it only checks out and builds.
permissions:
  contents: read

# Keyed on the workflow name, so this never cancels an Android CI run for the
# same ref. Pushes to main are left to finish; see android.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev librsvg2-bin imagemagick libfontconfig1-dev libgl1-mesa-dev libx11-dev

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The desktop app is a Kotlin/Native linuxX64 binary now, so the JVM
      # desktop tasks no longer exist. Compile and test the native target,
      # plus the shared core tests and the CLI tests.
      - name: Build and Test
        run: ./gradlew :core:desktopTest :desktop:linuxX64Test :cli:test

  # Real Windows DPAPI round trip. The job above can only drive
  # DpapiCredentialStore through a fake backend, since Crypt32 does not exist
  # on Linux; this runs the production store on a Windows runner, along with
  # the runtime token/metadata writes, which share the same atomic writer, and
  # the single-instance coordinator's local socket. The tests
  # are selected by name, so Gradle fails the job if the filter ever stops
  # matching rather than letting it pass with nothing run.
  windows-dpapi:

    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: DPAPI credential store on Windows
        run: .\gradlew.bat :core:desktopTest --tests "com.vinnovateit.latch.desktop.platform.windows.*" --tests "com.vinnovateit.latch.core.runtime.SecureRuntimeFilesTest" --tests "com.vinnovateit.latch.desktop.LegacyDataMigrationTest" --tests "com.vinnovateit.latch.desktop.DatabaseLocationTest" --tests "com.vinnovateit.latch.core.runtime.InstanceCoordinatorTest"

      # Gradle prints nothing per test. The timings show the real round trip
      # ran (it spawns a second JVM), rather than the off-Windows early return.
      - name: Show which DPAPI tests ran
        if: always()
        shell: pwsh
        run: Get-ChildItem core\build\test-results\desktopTest\TEST-*.windows.*.xml, core\build\test-results\desktopTest\TEST-*.SecureRuntimeFilesTest.xml, core\build\test-results\desktopTest\TEST-*.LegacyDataMigrationTest.xml, core\build\test-results\desktopTest\TEST-*.DatabaseLocationTest.xml, core\build\test-results\desktopTest\TEST-*.InstanceCoordinatorTest.xml | Select-String '<testsuite |<testcase '

  # Builds the self-contained native Windows installer. No JVM is involved:
  # :desktop:packageNativeMsiMingwX64 links the mingwX64 executable and packs
  # it with WiX at maximum compression.
  windows-msi:

    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Put WiX on PATH
        shell: pwsh
        run: '"$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Build compressed native MSI
        run: .\gradlew.bat :desktop:packageNativeMsiMingwX64 --no-daemon

      - name: Report installer size
        id: size
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem desktop\build\distributions\*-windows-x64.msi)
          if ($msi.Count -ne 1) { throw "Expected exactly one native MSI, found $($msi.Count)" }
          $mb = [math]::Round($msi[0].Length / 1MB, 2)
          Write-Host "MSI: $($msi[0].Name) - $mb MB ($($msi[0].Length) bytes, high compression)"
          "size-mb=$mb" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-msi
          path: desktop/build/distributions/*-windows-x64.msi
          if-no-files-found: error


  # Builds the native Linux tarball and checks its contents. The old smoke
  # script expects the JVM desktop layout, so it does not apply here.
  linux-packages:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev librsvg2-bin imagemagick libfontconfig1-dev libgl1-mesa-dev libx11-dev

      - name: Build Linux tarballs
        run: |
          chmod +x gradlew
          ./gradlew :desktop:packageNativeReleaseTarGz :cli:packageCliTarGz

      - name: Check the native desktop archive
        run: |
          version="$(sed -n 's/^latchVersion=//p' gradle.properties)"
          archive="desktop/build/distributions/latch-native-$version-linux-x64.tar.gz"
          test -f "$archive"
          tar -tzf "$archive" | grep -qx "latch-native-$version/bin/Latch"
          tar -tzf "$archive" | grep -qx "latch-native-$version/bin/data.kres"

      - name: Report Linux archive size
        run: |
          version="$(sed -n 's/^latchVersion=//p' gradle.properties)"
          archive="desktop/build/distributions/latch-native-$version-linux-x64.tar.gz"
          echo "Linux archive: $archive - $(du -h "$archive" | cut -f1) ($(stat -c%s "$archive") bytes, gzip level 9)"

      - name: Test the winget submission logic
        run: packaging/test-submit-winget.sh

