name: Build and Release Latch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Match the tag to the project version
        id: release
        shell: bash
        run: |
          version="$(sed -n 's/^latchVersion=//p' gradle.properties)"
          if [[ -z "$version" ]]; then
            echo "latchVersion is missing from gradle.properties" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi

          if [[ "$tag" != "v${version}" ]]; then
            echo "Release tag $tag does not match latchVersion=$version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Fails here in seconds rather than after both build jobs have run.
      - name: Require a changelog entry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: packaging/extract-release-notes.sh "$VERSION" >/dev/null

  build-linux:
    name: Build Linux artifacts
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install native packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm

      - name: Verify shared runtime and CLI
        run: |
          chmod +x gradlew
          ./gradlew :core:desktopTest :cli:test :desktop:smoke

      - name: Build Desktop and CLI packages
        run: |
          ./gradlew \
            :desktop:packageReleaseTarGz \
            :cli:packageCliTarGz \
            :cli:packageCliDeb \
            :cli:packageCliRpm

      - name: Smoke-test bundled CLI
        run: |
          cli/build/cli-package/image/latch-cli/bin/latch-cli --version
          test "$(cli/build/cli-package/image/latch-cli/bin/latch-cli --version)" = "latch-cli ${{ needs.prepare.outputs.version }}"

      # upload-artifact roots an artifact at the least common ancestor of its
      # path patterns. desktop/... and cli/... share only the repo root, so the
      # artifact kept the full source paths and the release job found
      # release-assets/cli/build/distributions/latch-cli-*.tar.gz rather than
      # release-assets/latch-cli-*.tar.gz. Staging into one directory first
      # makes the uploaded layout flat and independent of where Gradle wrote
      # each file.
      # upload-artifact roots an artifact at the least common ancestor of its
      # path patterns, so staging everything in one flat directory keeps the
      # release assets flat regardless of where Gradle wrote each file.
      - name: Stage Linux artifacts
        run: |
          mkdir -p staging
          cp desktop/build/distributions/*.tar.gz staging/
          cp cli/build/distributions/*.tar.gz staging/
          cp cli/build/distributions/*.deb staging/
          cp cli/build/distributions/*.rpm staging/
          ls -l staging

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          if-no-files-found: error
          path: staging/*

  build-windows:
    name: Build Windows artifacts
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Desktop MSI and portable CLI
        run: .\gradlew.bat :desktop:packageReleaseMsi :cli:packageCliZip

      - name: Smoke-test bundled CLI
        shell: pwsh
        run: |
          $launcher = "cli\build\cli-package\image\latch-cli\latch-cli.exe"
          $actual = & $launcher --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne "latch-cli ${{ needs.prepare.outputs.version }}") {
            throw "Unexpected CLI version output: $actual"
          }

      # Flattened for the same reason as the Linux job above.
      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          # Keep one stable GUI installer filename across patch rebuilds. The
          # MSI's internal product/version metadata remains controlled by
          # Compose/jpackage; only the release asset name is normalized here.
          $msi = @(Get-ChildItem desktop\build\compose\binaries\main-release\msi\*.msi)
          if ($msi.Count -ne 1) {
            throw "Expected exactly one Desktop MSI, found $($msi.Count)"
          }
          Copy-Item $msi.FullName staging\Latch-Setup.msi
          Copy-Item cli\build\distributions\*.zip staging\
          Get-ChildItem staging

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: staging/*

  release:
    name: Create GitHub release
    needs: [prepare, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      # Every downstream step here addresses release-assets/<file> directly, so
      # fail with the actual listing rather than a bare "must exist" if the
      # layout ever drifts again.
      - name: List downloaded artifacts
        run: ls -lR release-assets

      # AUR, winget and chocolatey all fetch the CLI from these release assets,
      # so their manifests are generated here against the exact files and
      # checksums that ship.
      - name: Generate package-manager manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          packaging/generate-cli-package-metadata.sh \
            "$VERSION" \
            "release-assets/latch-cli-$VERSION-linux-x64.tar.gz" \
            "release-assets/latch-cli-$VERSION-windows-x64.zip" \
            package-metadata
          (cd package-metadata && zip -qr "../release-assets/latch-cli-$VERSION-package-metadata.zip" .)

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      # The body is maintained in CHANGELOG.md, so re-running this workflow
      # republishes the same notes instead of overwriting them with boilerplate.
      - name: Extract release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: packaging/extract-release-notes.sh "$VERSION" release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          body_path: release-notes.md
          files: release-assets/*

      - name: Clear build artifacts storage
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            linux-artifacts
            windows-artifacts

  publish-repos:
    name: Publish Linux repositories
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # The published site is a branch, not a directory in main. Cloning it
      # rather than rebuilding from scratch is what keeps older releases
      # installable: the indexes are regenerated over everything present.
      - name: Fetch the published site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --branch gh-pages --depth 1 \
              "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" site; then
            echo "gh-pages does not exist yet; starting it"
            git clone --depth 1 \
              "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" site
            git -C site checkout --orphan gh-pages
            git -C site rm -rq --cached .
            find site -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          fi

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils createrepo-c rpm

      - name: Import the signing key
        env:
          SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | gpg --batch --import

      - name: Download the CLI packages from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --dir artifacts --pattern '*.deb' --pattern '*.rpm'

      - name: Build the APT and DNF repositories
        env:
          KEY_ID: ${{ secrets.PACKAGE_SIGNING_KEY_ID }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: packaging/build-linux-repos.sh site "$KEY_ID" artifacts

      - name: Publish
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Publish Latch $TAG to the APT and DNF repositories"
          git push origin gh-pages

  submit-winget:
    name: Submit to winget
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Fetch the generated manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release download "$TAG" --pattern '*-package-metadata.zip' --dir .
          unzip -q "latch-cli-$VERSION-package-metadata.zip" -d package-metadata

      # A repository-scoped token cannot push to a fork in another org, so this
      # needs a PAT with public_repo rather than GITHUB_TOKEN.
      - name: Open the winget pull request
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          packaging/submit-winget.sh "$VERSION" \
            "package-metadata/winget/VinnovateIT.LatchCLI/$VERSION"
