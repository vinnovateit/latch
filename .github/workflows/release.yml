name: Build and Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-linux:
    name: Build Linux Package (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux .tar.gz
        run: ./gradlew :desktop:packageReleaseTarGz

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: desktop/build/distributions/*.tar.gz

  build-windows:
    name: Build Windows Package (.msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Windows MSI
        run: .\gradlew.bat :desktop:packageReleaseMsi

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: desktop/build/compose/binaries/main-release/msi/*.msi

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            Update checker fix.

            What's New

            - Fixed: the app could show "update available" even when you already had the latest version

            Download the compatible version for your machine from the assets below.
          files: |
            release-assets/*

      - name: Clear build artifacts storage
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            linux-tarball
            windows-msi
