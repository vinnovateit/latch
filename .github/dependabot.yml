version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels: ["dependencies", "gradle"]
    commit-message:
      prefix: "deps(gradle)"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "deps(actions)"
    open-pull-requests-limit: 5