version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    commit-message:
      prefix: "deps(gradle)"
    open-pull-requests-limit: 10
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      # Compose Multiplatform is versioned independently of the Kotlin toolchain (its
      # Material3 alpha line moves on its own cadence), so it gets its own group rather
      # than riding along with Kotlin/KSP in the same PR.
      compose-multiplatform:
        patterns:
          - "org.jetbrains.compose*"
      androidx:
        patterns:
          - "androidx.*"
      # bcprov and bcpkix are a paired pin in the root build.gradle.kts buildscript
      # constraints, and the updater rewrites both when either artifact moves. Without
      # a group every bcprov/bcpkix release opens two PRs that fight over the same lines.
      bouncycastle:
        patterns:
          - "org.bouncycastle*"
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    commit-message:
      prefix: "deps(actions)"
    open-pull-requests-limit: 5